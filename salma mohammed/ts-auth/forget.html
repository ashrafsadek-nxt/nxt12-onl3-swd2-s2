<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <div class="form-container">
        <h2>Forget Password</h2>
        <form id="forgetForm">
            <input type="email" id="forgetEmail" placeholder="Enter your email" required>
            <button type="submit">Send Reset Link</button>
        </form>
        <p id="forgetError" class="error"></p>
        <p id="forgetSuccess" class="success"></p>
    </div>
    <script type="module" src="script/forget.js"></script>
</body>

</html>
