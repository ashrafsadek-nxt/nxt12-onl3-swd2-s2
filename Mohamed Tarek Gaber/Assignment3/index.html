<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match Challenge</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="game-title">Memory Match Challenge</h1>

        <section class="card-info">
            <div class="score">
                <h3>Points: <span>0</span></h3>
            </div>

            <div class="timer">
                <h3>Timer: <span>00:00</span></h3>
            </div>

            <div class="moves">
                <h3>Moves: <span>0</span></h3>
            </div>
        </section>

        <section class="card-play">
            <div class="game-board"></div>
        </section>

        <section class="card-btn">
            <button class="btn restart-btn">🔁 New Challenge</button>
            <button class="btn reset-btn">🧹 Reset Board</button>
        </section>
    </div>

    <div class="success-modal" id="successModal">
        <div class="success-content">
            <h2>🎉 Well Done!</h2>
            <p>You completed the game!</p>
            <p id="finalStats"></p>
            <button class="close-modal" onclick="closeSuccessModal()">Try Again</button>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
